<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.85" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Orbital Ring 1 -->
  <ellipse cx="16" cy="16" rx="11" ry="4.8" transform="rotate(-28 16 16)" stroke="url(#ringGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.9" fill="none" />

  <!-- Orbital Ring 2 -->
  <ellipse cx="16" cy="16" rx="11" ry="4.8" transform="rotate(38 16 16)" stroke="url(#ringGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.9" fill="none" />

  <!-- Center Ion Nucleus -->
  <circle cx="16" cy="16" r="3" fill="#FFFFFF" filter="url(#coreGlow)" />
  <circle cx="16" cy="16" r="1.7" fill="#0284C7" />

  <!-- Orbiting Energy Particles -->
  <circle cx="24.5" cy="11.5" r="1.3" fill="#FFFFFF" />
  <circle cx="7.5" cy="20.5" r="1.1" fill="#FFFFFF" />
  <circle cx="22" cy="22" r="1.2" fill="#E0F2FE" />
</svg>
